<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ERP.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="ERP.js"></script>
    <title>Gestão de estoque</title>
</head>

<body>
    <div id="cadastro">
        <label>Nome do produto</label>
        <input type="text" id="nmProduto">
        <br>
        <label>Quantidade em estoque</label>
        <input type="number" min="0" id="nrEstoque">
        <br>
        <label>Preço</label>
        <input type="number" min="1" id="precoProduto">
        <br>
        <label>ID</label>
        <input type="number" readonly placeholder="O ID do produto é gerado pelo sistema">
        <button id="btnCadastrar">Cadastrar</button>
    </div>
</body>
<div id="produtos">
</div>

</html>
